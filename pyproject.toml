[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ukfuelfinder"
version = "3.0.0"
description = "Python library for accessing the UK Government Fuel Finder API (KRoperUK fork)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Mark Retallack", email = "mark@retallack.org.uk"},
    {name = "KRoperUK"},
]
keywords = ["fuel", "prices", "uk", "government", "api", "petrol", "diesel"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
# Test-only deps (no lint tools) — used by the CI test matrix so EOL
# interpreters (3.8/3.9) don't try to install ruff/mypy, which need >=3.10.
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
    "vcrpy>=4.2.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
    "vcrpy>=4.2.0",
    "python-dotenv>=1.0.0",
    "types-requests>=2.31.0",
    "types-python-dateutil>=2.8.0",
    # Linting & type checking (keep in sync with .github/workflows/test.yml).
    # Conditional: ruff/mypy 2.x require Python >= 3.10.
    "ruff==0.16.0; python_version >= '3.10'",
    "mypy==2.3.0; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/KRoperUK/ukfuelfinder"
Documentation = "https://github.com/KRoperUK/ukfuelfinder/blob/main/README.md"
Repository = "https://github.com/KRoperUK/ukfuelfinder"
Issues = "https://github.com/KRoperUK/ukfuelfinder/issues"

# setuptools flat-layout auto-discovery would otherwise pick up tests/ (it has
# an __init__.py) and examples/ — restrict the distribution to the library itself.
[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.mypy]
# mypy 2.x no longer accepts python_version < 3.10. This only sets the type-check
# target; the runtime floor stays at 3.8 (requires-python) and ruff's py38 target
# keeps newer syntax out.
python_version = "3.10"
files = ["ukfuelfinder"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Integration tests (marked `integration`) hit the real Fuel Finder API and need
# credentials, so they are deselected by default; the live-smoke workflow runs
# them explicitly with `-m integration`.
addopts = "-v -m 'not integration' --cov=ukfuelfinder --cov-report=term-missing"
markers = [
    "unit: Unit tests",
    "integration: requires live Fuel Finder API credentials (deselect with -m 'not integration')",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["ukfuelfinder"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Coverage floor enforced by pytest-cov in CI. Currently ~74% (client.py and the
# services are the thin spots); 70 leaves headroom without being brittle — raise
# it as coverage improves.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
