# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Stages:
# * ``pre-commit`` — fast checks (ruff, mypy). Run on every commit.
# * ``pre-push`` — the full pytest suite with coverage (the fail_under floor in
#   [tool.coverage.report] is enforced before CI ever sees the branch).
#
# Enable both stages once with:
#   pre-commit install --hook-type pre-commit --hook-type pre-push
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff pin in pyproject.toml [dev] and test.yml.
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Strict-enough mypy on the whole package. Runs once per commit regardless
      # of which files staged — mypy's cross-file inference means a change in one
      # module can surface an error in another.
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        pass_filenames: false
        files: \.py$
        stages: [pre-commit]

      # Full pytest run on push so no broken commit reaches origin. addopts
      # (pyproject.toml) already enables coverage with the fail_under floor.
      - id: pytest
        name: pytest (with coverage)
        entry: .venv/bin/python -m pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
