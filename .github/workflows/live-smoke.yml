name: Live smoke test

# Gated live validation against the real UK Fuel Finder API. Unit tests mock the
# API with fixtures, so contract regressions (schema changes, auth flow drift,
# pagination bugs) can't be caught by them — only a real account confirms the
# API still behaves as the client expects. Runs on demand and nightly, never on
# PRs (protects secrets). The `real_client` fixture skips when its credentials
# are absent, so a fork or unconfigured repo sees a green, no-op run.

on:
  workflow_dispatch: {}
  schedule:
    # 03:41 UTC daily (off the hour to avoid the scheduler rush).
    - cron: "41 3 * * *"

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: true

jobs:
  live:
    # Never run the scheduled job on forks — they don't have the secrets and it
    # would just be a pointless (or confusingly skipped) run.
    if: github.repository == 'KRoperUK/ukfuelfinder'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run live integration tests (read-only)
        # The real_client fixture skips when its secrets are absent, so this is
        # a green no-op without them. `-m integration` overrides the default
        # `-m 'not integration'` deselection; `-o addopts=` drops coverage.
        env:
          FUEL_FINDER_CLIENT_ID: ${{ secrets.FUEL_FINDER_CLIENT_ID }}
          FUEL_FINDER_CLIENT_SECRET: ${{ secrets.FUEL_FINDER_CLIENT_SECRET }}
          FUEL_FINDER_ENVIRONMENT: ${{ secrets.FUEL_FINDER_ENVIRONMENT }}
        run: pytest tests/integration -m integration -o addopts= -v
